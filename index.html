<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>アーカイブサイト</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f2ec;
      --ink: #252722;
      --muted: #74766f;
      --rule: #d8d6ce;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100% - 64px, 1440px);
      margin: 0 auto;
      padding: 54px 0 72px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--rule);
    }

    h1 {
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(2rem, 4vw, 3.5rem);
      font-weight: 500;
      letter-spacing: .08em;
      line-height: 1.2;
    }

    .question {
      min-width: min(32vw, 300px);
      padding-bottom: 3px;
    }

    .question-label {
      display: block;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: .75rem;
      letter-spacing: .08em;
    }

    .question-space {
      height: 1px;
      background: var(--rule);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
      gap: 48px 24px;
      padding-top: 34px;
    }

    figure { min-width: 0; margin: 0; }

    figure img {
      display: block;
      width: 100%;
      height: auto;
      background: #e8e6df;
    }

    figcaption {
      padding-top: 13px;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: 1rem;
      letter-spacing: .04em;
    }

    .photo-name { margin: 0 0 10px; }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      font-size: .75rem;
      letter-spacing: 0;
    }

    .tags li {
      padding: 5px 8px;
      border: 1px solid var(--rule);
      color: var(--muted);
    }

    @media (max-width: 760px) {
      .page { width: min(100% - 36px, 560px); padding: 32px 0 48px; }
      header { display: block; padding-bottom: 20px; }
      .question { min-width: 0; margin-top: 24px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 14px; padding-top: 22px; }
      figcaption { padding-top: 9px; font-size: .9rem; }
    }

    @media (max-width: 480px) {
      .grid { grid-template-columns: 1fr; gap: 28px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>アーカイブサイト</h1>
      <div class="question" aria-label="いま気になっていること">
        <span class="question-label">いま気になっていること</span>
        <div class="question-space" aria-hidden="true"></div>
      </div>
    </header>
    <section class="grid" id="archive" aria-label="写真"></section>
  </main>

  <script>
    const photos = [
      { file: "01.jpg", name: "(ここに言葉)", tags: [] },
      { file: "02.jpg", name: "(ここに言葉)", tags: [] },
      {
        file: "03.jpg",
        name: "紅茶のシフォン",
        tags: [
          { label: "いつ", value: "2026年" },
          { label: "どこで", value: "イオンモール桂川内のカフェ" }
        ]
      },
      { file: "04.jpg", name: "(ここに言葉)", tags: [] },
      { file: "05.jpg", name: "(ここに言葉)", tags: [] }
    ];
    const archive = document.querySelector("#archive");

    archive.innerHTML = photos.map((photo, index) => `
      <figure>
        <img src="images/${photo.file}" alt="資料写真 ${String(index + 1).padStart(2, "0")}" loading="lazy">
        <figcaption>
          <p class="photo-name">${photo.name}</p>
          ${photo.tags.length ? `<ul class="tags">${photo.tags.map(tag => `<li>${tag.label}: ${tag.value}</li>`).join("")}</ul>` : ""}
        </figcaption>
      </figure>
    `).join("");
  </script>
</body>
</html>
